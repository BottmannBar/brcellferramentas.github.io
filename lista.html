<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BRCELL — Estoque Premium Lab Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black:      #222323;
      --graphite:   #1a1a1a;
      --card:       #212121;
      --row-alt:    #1e1e1e;
      --green:      #28a745;
      --green-dim:  #1d7a34;
      --green-glow: rgba(40,167,69,0.18);
      --text:       #e8e8e8;
      --muted:      #8a8a8a;
      --border:     rgba(40,167,69,0.15);
      --divider:    rgba(255,255,255,0.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--black);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      background-image:
        linear-gradient(var(--divider) 1px, transparent 1px),
        linear-gradient(90deg, var(--divider) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── AMPULHETA ── */
    .hourglass {
      display: inline-block;
      animation: flip 4s cubic-bezier(0.4,0,0.6,1) infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes flip {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(180deg); }
      100% { transform: rotate(180deg); }
    }

    /* ── PROMO BANNER ── */
    .promo-banner {
      margin-top: 10px;
      padding: 7px 14px;
      background: rgba(40,167,69,0.1);
      border: 1px dashed var(--green);
      border-radius: 6px;
      display: inline-block;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.4;
    }
    .promo-banner strong {
      color: var(--green);
      text-transform: uppercase;
    }

    /* ── HEADER ── */
    header {
      background: var(--graphite);
      border-bottom: 1px solid var(--border);
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px, 4.5vw, 40px);
      letter-spacing: 3px;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 0 30px var(--green-glow);
    }

    /* ── TOOLBAR ── */
    .toolbar {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 10px 10px 32px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }
    .search-input::placeholder { color: var(--muted); }

    .filters-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-select {
      flex: 1;
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      min-width: 0;
    }
    .filter-select:focus { border-color: var(--green); }

    .count-badge {
      background: var(--green-glow);
      border: 1px solid var(--border);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 6px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════
       TABELA — visível apenas em desktop (>640px)
    ══════════════════════════════════════════════ */
    .table-wrap { padding: 0 16px 40px; }

    .table-container {
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: linear-gradient(135deg, var(--green-dim) 0%, var(--green) 100%); }
    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: rgba(255,255,255,0.1); }
    thead th .th-inner { display: flex; align-items: center; gap: 5px; }
    thead th .sort-icon { opacity: 0.5; font-size: 9px; }
    thead th.sorted .sort-icon { opacity: 1; }

    tbody tr {
      border-bottom: 1px solid var(--divider);
      transition: background 0.15s;
      animation: fadeRow 0.3s ease both;
    }
    @keyframes fadeRow {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:nth-child(odd)  { background: var(--graphite); }
    tbody tr:hover { background: rgba(40,167,69,0.07) !important; }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 12px 16px; vertical-align: middle; }

    .cell-brand { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .cell-device { font-weight: 500; color: var(--text); }
    .cell-storage {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: 500;
      color: var(--text); white-space: nowrap;
    }
    .cell-color { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
    .cell-price { font-weight: 700; font-size: 15px; color: var(--green); white-space: nowrap; text-shadow: 0 0 12px var(--green-glow); }

    .wa-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #128c3e; color: #fff; text-decoration: none;
      font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 20px;
      white-space: nowrap; transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 2px 10px rgba(18,140,62,0.25);
    }
    .wa-btn:hover { background: #25d366; transform: translateY(-1px); box-shadow: 0 4px 18px rgba(37,211,102,0.4); }
    .wa-btn:active { transform: translateY(0); }

    .empty-row td { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .empty-row td svg { display: block; margin: 0 auto 12px; opacity: 0.3; }

    /* ══════════════════════════════════════════════
       CARDS — visível apenas em mobile (≤640px)
    ══════════════════════════════════════════════ */
    .cards-container {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 0 16px 40px;
    }

    .card {
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      animation: fadeRow 0.3s ease both;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-brand { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 3px; }
    .card-device { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .card-price { font-size: 20px; font-weight: 700; color: var(--green); text-shadow: 0 0 12px var(--green-glow); white-space: nowrap; }

    .card-details { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .card-storage {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px; padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--text);
    }
    .card-color { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

    .card-wa {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #128c3e; color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 600; padding: 13px;
      border-radius: 10px; transition: background 0.2s;
      box-shadow: 0 2px 14px rgba(18,140,62,0.3);
    }
    .card-wa:active { background: #25d366; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 16px 20px; font-size: 11px;
      color: var(--muted); letter-spacing: 1px; border-top: 1px solid var(--divider);
    }
    footer strong { color: var(--green); }

    /* ── RESPONSIVE SWITCH ── */
    @media (max-width: 640px) {
      .table-wrap      { display: none; }
      .cards-container { display: flex; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo-name">
    BRCELL — APARELHOS DISPONÍVEIS EM TEMPO REAL
    <span class="hourglass">⏳</span>
  </div>
  <div class="promo-banner">
    🎁 Ganhe <strong>R$ 100,00 de desconto</strong> em qualquer aparelho anunciando que viu este site!
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Buscar aparelho, marca, cor…" />
  </div>
  <div class="filters-row">
    <select class="filter-select" id="brandFilter">
      <option value="">Todas as marcas</option>
    </select>
    <select class="filter-select" id="storageFilter">
      <option value="">Armazenamento</option>
    </select>
    <div class="count-badge" id="countBadge">0 itens</div>
  </div>
</div>

<!-- TABELA (desktop) -->
<div class="table-wrap">
  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th data-col="marca"         onclick="sortTable('marca')">        <div class="th-inner">Marca         <span class="sort-icon">⇅</span></div></th>
          <th data-col="aparelho"      onclick="sortTable('aparelho')">     <div class="th-inner">Aparelho      <span class="sort-icon">⇅</span></div></th>
          <th data-col="armazenamento" onclick="sortTable('armazenamento')"><div class="th-inner">Armazenamento <span class="sort-icon">⇅</span></div></th>
          <th data-col="cor"           onclick="sortTable('cor')">          <div class="th-inner">Cor           <span class="sort-icon">⇅</span></div></th>
          <th data-col="preco"         onclick="sortTable('preco')">        <div class="th-inner">Preço         <span class="sort-icon">⇅</span></div></th>
          <th style="text-align:center"><div class="th-inner" style="justify-content:center">Contato</div></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- CARDS (mobile) -->
<div class="cards-container" id="cardsContainer"></div>

<!-- FOOTER -->
<footer>
  Atualizado em <strong id="footerDate"></strong> &nbsp;·&nbsp;
  <strong>BRCELL</strong> Premium Lab Services
</footer>

<script>
  const SHEET_ID  = "1sRrPvd9Vk77rrCA78yUG1L3G-xO-1vy_pgdrbrfLGKE";
  const SHEET_TAB = "BANCODEAPARELHOS";
  const WA_NUMBER = "5541997589418";

  // E=Marca(4) F=Modelo(5) G=Cor(6) H=Armazenamento(7) L=Preço(11) P=Status(15)
  const COL = { marca:4, aparelho:5, cor:6, armazenamento:7, preco:11, status:15 };

  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

  const COLOR_MAP = {
    "preto":"#2a2a2a","black":"#2a2a2a","meia-noite":"#1c1c1e","onyx black":"#2a2a2a",
    "phantom black":"#2a2a2a","midnight black":"#2a2a2a","black beauty":"#2a2a2a",
    "branco":"#f0f0f0","white":"#f0f0f0","titanium white":"#f0eeec","titânio natural":"#e8e2d8",
    "titânio branco":"#f0eeec","marble gray":"#c8c8c8","koala gray":"#9a9a9a",
    "urban gray":"#7a7a7a","titânio cinza":"#8a8a8a","titânio preto":"#3a3a3a",
    "azul":"#3a8ecc","blue":"#3a8ecc","titânio azul":"#5b8db8","awesome navy":"#1b3a6e",
    "cobalt violet":"#5c4db1","lavender":"#c9b8e8","roxo profundo":"#4a2c6e",
    "amarelo":"#f7c843","yellow":"#f7c843","peach fuzz":"#ffb79a","dourado":"#c9a84c","gold":"#c9a84c",
    "rosa":"#f4a7b9","pink":"#f4a7b9","aqua green":"#4dc4b0","vermelho":"#e74c3c","red":"#e74c3c",
    "awesome iceblue":"#89cfe8","verde":"#28a745","green":"#28a745",
    "cinza":"#888","gray":"#888","grafite":"#555","prata":"#ccc","silver":"#ccc",
  };

  function colorDot(cor) {
    const bg = COLOR_MAP[(cor||"").toLowerCase()] || "#666";
    return `<span class="color-dot" style="background:${bg}"></span>`;
  }

  function fmtPrice(v) {
    const n = parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",","."));
    return isNaN(n) ? v : "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:2});
  }

  function parsePrice(v) {
    return parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",",".")) || 0;
  }

  function parseCSV(text) {
    return text.trim().split("\n").slice(1).map(line => {
      const cols = []; let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c==='"') { inQ=!inQ; }
        else if (c===","&&!inQ) { cols.push(cur.trim()); cur=""; }
        else cur+=c;
      }
      cols.push(cur.trim());
      return cols;
    });
  }

  let sortCol = "preco", sortDir = -1, STOCK = [];

  const WA_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

  function buildWaUrl(r) {
    const pFmt = r.preco > 0 ? fmtPrice(r.preco) : r.precoRaw;
    const msg  = encodeURIComponent(`Olá! Tenho interesse no ${r.aparelho} ${r.armazenamento} ${r.cor} por ${pFmt}. Ainda disponível?`);
    return `https://wa.me/${WA_NUMBER}?text=${msg}`;
  }

  async function loadSheet() {
    document.getElementById("tableBody").innerHTML =
      `<tr class="empty-row"><td colspan="6"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" style="animation:spin 1s linear infinite;margin:0 auto 10px;display:block"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Carregando dados…</td></tr>`;
    document.getElementById("cardsContainer").innerHTML =
      `<div style="text-align:center;padding:40px;color:var(--muted)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" style="animation:spin 1s linear infinite;margin:0 auto 10px;display:block"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Carregando…</div>`;
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);

      STOCK = rows
        .filter(r => {
          const status = (r[COL.status]||"").trim().toLowerCase();
          return r[COL.aparelho] && r[COL.aparelho].length > 0 && status === "disponivel";
        })
        .map(r => ({
          marca:         r[COL.marca]        || "",
          aparelho:      r[COL.aparelho]      || "",
          armazenamento: r[COL.armazenamento] || "",
          cor:           r[COL.cor]           || "",
          preco:         parsePrice(r[COL.preco]),
          precoRaw:      r[COL.preco]         || "",
        }));

      populateFilters();
      render();

      document.getElementById("footerDate").textContent =
        new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"}) +
        " às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

    } catch(err) {
      const msg = `Erro ao carregar dados.<br><small style="color:var(--muted)">${err.message}</small><br><br><small>Verifique se a planilha está com acesso público.</small>`;
      document.getElementById("tableBody").innerHTML =
        `<tr class="empty-row"><td colspan="6"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" style="margin:0 auto 10px;display:block"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>${msg}</td></tr>`;
      document.getElementById("cardsContainer").innerHTML =
        `<div style="text-align:center;padding:40px;color:#e74c3c">${msg}</div>`;
    }
  }

  function filtered() {
    const q  = document.getElementById("searchInput").value.toLowerCase();
    const br = document.getElementById("brandFilter").value;
    const st = document.getElementById("storageFilter").value;
    return STOCK.filter(r =>
      (!br || r.marca === br) &&
      (!st || r.armazenamento === st) &&
      (!q  || Object.values(r).some(v => String(v).toLowerCase().includes(q)))
    );
  }

  function sortTable(col) {
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = col==="preco" ? -1 : 1; }
    render();
    document.querySelectorAll("thead th").forEach(th => {
      th.classList.toggle("sorted", th.dataset.col === col);
      const ic = th.querySelector(".sort-icon");
      if (ic) ic.textContent = th.dataset.col===col ? (sortDir===1?"↑":"↓") : "⇅";
    });
  }

  function render() {
    const rows = filtered().sort((a,b) => {
      let va=a[sortCol], vb=b[sortCol];
      if (typeof va==="number") return (va-vb)*sortDir;
      return String(va).localeCompare(String(vb),"pt-BR")*sortDir;
    });

    /* ── tabela desktop ── */
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = rows.length === 0
      ? `<tr class="empty-row"><td colspan="6"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Nenhum aparelho encontrado</td></tr>`
      : rows.map((r,i) => `
          <tr style="animation-delay:${Math.min(i*18,300)}ms">
            <td><span class="cell-brand">${r.marca}</span></td>
            <td><span class="cell-device">${r.aparelho}</span></td>
            <td><span class="cell-storage">${r.armazenamento}</span></td>
            <td><span class="cell-color">${colorDot(r.cor)} ${r.cor}</span></td>
            <td><span class="cell-price">${r.preco>0?fmtPrice(r.preco):r.precoRaw}</span></td>
            <td style="text-align:center">
              <a class="wa-btn" href="${buildWaUrl(r)}" target="_blank" rel="noopener">
                ${WA_SVG} Tenho Interesse
              </a>
            </td>
          </tr>`).join("");

    /* ── cards mobile ── */
    const cc = document.getElementById("cardsContainer");
    cc.innerHTML = rows.length === 0
      ? `<div style="text-align:center;padding:40px;color:var(--muted)">Nenhum aparelho encontrado</div>`
      : rows.map((r,i) => `
          <div class="card" style="animation-delay:${Math.min(i*18,300)}ms">
            <div class="card-header">
              <div>
                <div class="card-brand">${r.marca}</div>
                <div class="card-device">${r.aparelho}</div>
              </div>
              <div class="card-price">${r.preco>0?fmtPrice(r.preco):r.precoRaw}</div>
            </div>
            <div class="card-details">
              <span class="card-storage">${r.armazenamento}</span>
              <span class="card-color">${colorDot(r.cor)} ${r.cor}</span>
            </div>
            <a class="card-wa" href="${buildWaUrl(r)}" target="_blank" rel="noopener">
              ${WA_SVG} Tenho Interesse
            </a>
          </div>`).join("");

    document.getElementById("countBadge").textContent =
      `${rows.length} ${rows.length===1?"item":"itens"}`;
  }

  function populateFilters() {
    const bf = document.getElementById("brandFilter");
    const sf = document.getElementById("storageFilter");
    bf.innerHTML = `<option value="">Todas as marcas</option>`;
    sf.innerHTML = `<option value="">Armazenamento</option>`;
    [...new Set(STOCK.map(r=>r.marca).filter(Boolean))].sort()
      .forEach(b => { const o=document.createElement("option"); o.value=b; o.textContent=b; bf.appendChild(o); });
    [...new Set(STOCK.map(r=>r.armazenamento).filter(Boolean))]
      .sort((a,b)=>parseInt(a)-parseInt(b))
      .forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; sf.appendChild(o); });
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("brandFilter").addEventListener("change", render);
  document.getElementById("storageFilter").addEventListener("change", render);

  loadSheet();
</script>
</body>
</html>
