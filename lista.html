<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRCELL — Estoque Premium Lab Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black:    #0f0f0f;
      --graphite: #1a1a1a;
      --card:     #212121;
      --row-alt:  #1e1e1e;
      --green:    #28a745;
      --green-dim:#1d7a34;
      --green-glow: rgba(40,167,69,0.18);
      --text:     #e8e8e8;
      --muted:    #8a8a8a;
      --border:    rgba(40,167,69,0.15);
      --divider:  rgba(255,255,255,0.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--black);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      background-image:
        linear-gradient(var(--divider) 1px, transparent 1px),
        linear-gradient(90deg, var(--divider) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    header {
      background: var(--graphite);
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .logo-block { display: flex; align-items: baseline; gap: 14px; }
    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 30px var(--green-glow);
    }
    .logo-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 3px 8px;
      border-radius: 3px;
    }

    .header-sub {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
    }
    .header-sub span { display: block; font-size: 10px; color: var(--green); margin-top: 3px; }

    .toolbar { padding: 20px 40px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    
    .search-input {
      width: 100%;
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px 9px 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }

    .filter-select {
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .count-badge {
      margin-left: auto;
      background: var(--green-glow);
      border: 1px solid var(--border);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .table-wrap { padding: 0 40px 40px; }
    .table-container {
      background: var(--graphite);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: linear-gradient(135deg, var(--green-dim) 0%, var(--green) 100%); }
    thead th { padding: 14px 20px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #fff; cursor: pointer; }

    tbody tr { border-bottom: 1px solid var(--divider); animation: fadeRow 0.3s ease both; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody td { padding: 13px 20px; }

    .cell-brand { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .cell-device { font-weight: 500; color: var(--text); }
    .cell-storage { background: rgba(255,255,255,0.05); border-radius: 5px; padding: 3px 10px; font-size: 12px; }
    .cell-price { font-weight: 700; font-size: 15px; color: var(--green); text-shadow: 0 0 12px var(--green-glow); }
    
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 1px solid rgba(255,255,255,0.2); }

    .wa-btn {
      display: inline-flex; align-items: center; gap: 7px; background: #128c3e; color: #fff;
      text-decoration: none; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px;
    }
    .wa-btn:hover { background: #25d366; transform: translateY(-1px); }

    footer { text-align: center; padding: 20px 40px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--divider); }

    @keyframes fadeRow { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      header { padding: 16px 20px; flex-direction: column; align-items: flex-start; }
      .logo-name { font-size: 36px; }
      .toolbar, .table-wrap { padding: 10px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-block">
    <div class="logo-name">BRCELL</div>
    <div class="logo-tag">Premium</div>
  </div>
  <div class="header-sub">Estoque de Aparelhos <span>Premium Lab Services</span></div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Buscar aparelho, marca, cor…" />
  </div>
  <select class="filter-select" id="brandFilter"><option value="">Todas as marcas</option></select>
  <select class="filter-select" id="storageFilter"><option value="">Todo armazenamento</option></select>
  <div class="count-badge" id="countBadge">0 itens</div>
</div>

<div class="table-wrap">
  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th data-col="marca" onclick="sortTable('marca')">Marca <span class="sort-icon">⇅</span></th>
          <th data-col="aparelho" onclick="sortTable('aparelho')">Aparelho <span class="sort-icon">⇅</span></th>
          <th data-col="armazenamento" onclick="sortTable('armazenamento')">Armazenamento <span class="sort-icon">⇅</span></th>
          <th data-col="cor" onclick="sortTable('cor')">Cor <span class="sort-icon">⇅</span></th>
          <th data-col="preco" onclick="sortTable('preco')">Preço <span class="sort-icon">⇅</span></th>
          <th style="text-align:center">Contato</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<footer>
  Atualizado em <strong id="footerDate"></strong> · <strong>BRCELL</strong> Premium Lab Services
</footer>

<script>
  const SHEET_ID = "1sRrPvd9Vk77rrCA78yUG1L3G-xO-1vy_pgdrbrfLGKE";
  const SHEET_TAB = "COPIAR";
  const WA_NUMBER = "5541997589418"; 
  const COL = { marca: 0, aparelho: 2, armazenamento: 3, cor: 4, preco: 14 };

  // Link formatado para evitar erro de CORS no GitHub
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

  const COLOR_MAP = {
    "preto":"#1a1a1a", "branco":"#f5f5f5", "azul":"#3a8ecc", "verde":"#28a745", "rosa":"#f4a7b9", "amarelo":"#f7c843",
    "meia-noite":"#1c1c1e", "titânio natural":"#e8e2d8", "titânio preto":"#2a2a2a", "roxo profundo":"#4a2c6e"
  };

  function colorDot(cor) {
    const bg = COLOR_MAP[(cor || "").toLowerCase()] || "#555";
    return `<span class="color-dot" style="background:${bg}"></span>`;
  }

  function parsePrice(v) {
    return parseFloat(String(v).replace(/[R$\s.]/g, "").replace(",", ".")) || 0;
  }

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') inQ = !inQ;
        else if (c === "," && !inQ) { cols.push(cur.trim()); cur = ""; }
        else cur += c;
      }
      cols.push(cur.trim());
      return cols;
    });
  }

  let sortCol = "preco", sortDir = -1, STOCK = [];

  async function loadSheet() {
    document.getElementById("tableBody").innerHTML = '<tr><td colspan="6" style="text-align:center;padding:50px">Carregando estoque BRCELL...</td></tr>';
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = parseCSV(text);

      STOCK = rows.filter(r => r[COL.aparelho]).map(r => ({
        marca: r[COL.marca] || "",
        aparelho: r[COL.aparelho] || "",
        armazenamento: r[COL.armazenamento] || "",
        cor: r[COL.cor] || "",
        preco: parsePrice(r[COL.preco]),
        precoRaw: r[COL.preco] || ""
      }));

      populateFilters();
      render();
      document.getElementById("footerDate").textContent = new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
    } catch (err) {
      document.getElementById("tableBody").innerHTML = '<tr><td colspan="6" style="text-align:center;color:#ff4444">Erro ao conectar com a planilha. Verifique o acesso.</td></tr>';
    }
  }

  function render() {
    const rows = STOCK.filter(r => {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const br = document.getElementById("brandFilter").value;
      const st = document.getElementById("storageFilter").value;
      return (!br || r.marca === br) && (!st || r.armazenamento === st) && (!q || Object.values(r).some(v => String(v).toLowerCase().includes(q)));
    }).sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      return (typeof va === "number" ? va - vb : String(va).localeCompare(String(vb))) * sortDir;
    });

    document.getElementById("tableBody").innerHTML = rows.map((r, i) => {
      const msg = encodeURIComponent(`Olá! Tenho interesse no ${r.aparelho} ${r.armazenamento} ${r.cor}. Ainda disponível?`);
      return `<tr>
        <td><span class="cell-brand">${r.marca}</span></td>
        <td><span class="cell-device">${r.aparelho}</span></td>
        <td><span class="cell-storage">${r.armazenamento}</span></td>
        <td><span class="cell-color">${colorDot(r.cor)} ${r.cor}</span></td>
        <td><span class="cell-price">R$ ${r.preco.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span></td>
        <td style="text-align:center"><a class="wa-btn" href="https://wa.me/${WA_NUMBER}?text=${msg}" target="_blank">Tenho Interesse</a></td>
      </tr>`;
    }).join("");
    document.getElementById("countBadge").textContent = `${rows.length} itens`;
  }

  function populateFilters() {
    const bf = document.getElementById("brandFilter"), sf = document.getElementById("storageFilter");
    const brands = [...new Set(STOCK.map(r => r.marca).filter(Boolean))].sort();
    const storages = [...new Set(STOCK.map(r => r.armazenamento).filter(Boolean))].sort((a,b) => parseInt(a)-parseInt(b));
    brands.forEach(b => bf.innerHTML += `<option value="${b}">${b}</option>`);
    storages.forEach(s => sf.innerHTML += `<option value="${s}">${s}</option>`);
  }

  function sortTable(col) {
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    render();
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("brandFilter").addEventListener("change", render);
  document.getElementById("storageFilter").addEventListener("change", render);
  
  loadSheet();
</script>
</body>
</html>
