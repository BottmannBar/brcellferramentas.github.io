<script>
  // 1. INSIRA SEU LINK DO GOOGLE SHEETS AQUI (O link que termina em .csv)
  const SHEET_CSV_URL = 'COLE_AQUI_O_LINK_DA_PLANILHA_PUBLICADA';
  const WHATSAPP_NUMBER = "5541999999999"; // Coloque o número da BRCELL aqui

  let STOCK = [];
  let sortCol = "preco", sortDir = 1;

  async function loadSheetData() {
    try {
      const response = await fetch(SHEET_CSV_URL);
      const csvText = await response.text();
      
      // Converte CSV em Array de Objetos
      const rows = csvText.split('\n').map(row => row.split(','));
      
      // Mapeia as colunas conforme seu pedido: A(0), C(2), D(3), E(4), O(14)
      // Pulamos a primeira linha (cabeçalho) começando do index 1
      STOCK = rows.slice(1).filter(row => row[2]).map(row => ({
        marca: row[0]?.trim(),
        aparelho: row[2]?.trim(),
        armazenamento: row[3]?.trim(),
        cor: row[4]?.trim(),
        preco: parseFloat(row[14]?.replace(/[^\d,.-]/g, '').replace(',', '.')) || 0
      }));

      populateFilters();
      render();
    } catch (err) {
      console.error("Erro ao carregar planilha:", err);
      document.getElementById("tableBody").innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 40px;'>Erro ao conectar com a planilha. Verifique se ela foi publicada corretamente.</td></tr>";
    }
  }

  /* ── colour map para os dots ── */
  const COLOR_MAP = {
    "preto":"#1a1a1a","black":"#1a1a1a","meia-noite":"#1c1c1e","onyx black":"#1a1a1a",
    "branco":"#f5f5f5","white":"#f5f5f5","azul":"#3a8ecc","blue":"#3a8ecc",
    "verde":"#28a745","amarelo":"#f7c843","rosa":"#f4a7b9"
  };

  function colorDot(cor) {
    const key = cor ? cor.toLowerCase() : "";
    const bg = COLOR_MAP[key] || "#555";
    return `<span class="color-dot" style="background:${bg}"></span>`;
  }

  function fmtPrice(v) {
    return "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
  }

  function filtered() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const br = document.getElementById("brandFilter").value;
    const st = document.getElementById("storageFilter").value;
    return STOCK.filter(r =>
      (!br || r.marca === br) &&
      (!st || r.armazenamento === st) &&
      (!q || Object.values(r).some(v => String(v).toLowerCase().includes(q)))
    );
  }

  function sortTable(col) {
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    render();
    document.querySelectorAll("thead th").forEach(th => {
      th.classList.toggle("sorted", th.dataset.col === col);
      const ic = th.querySelector(".sort-icon");
      if (ic) ic.textContent = th.dataset.col === col ? (sortDir === 1 ? "↑" : "↓") : "⇅";
    });
  }

  function render() {
    const rows = filtered().sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (typeof va === "number") return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), "pt-BR") * sortDir;
    });

    const tbody = document.getElementById("tableBody");
    if (rows.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Nenhum aparelho encontrado</td></tr>`;
    } else {
      tbody.innerHTML = rows.map((r, i) => {
        const msg = encodeURIComponent(`Olá BRCELL! Tenho interesse no ${r.aparelho} ${r.armazenamento} ${r.cor}. Ainda disponível?`);
        return `
        <tr style="animation-delay:${Math.min(i * 18, 300)}ms">
          <td><span class="cell-brand">${r.marca}</span></td>
          <td><span class="cell-device">${r.aparelho}</span></td>
          <td><span class="cell-storage">${r.armazenamento}</span></td>
          <td><span class="cell-color">${colorDot(r.cor)} ${r.cor}</span></td>
          <td><span class="cell-price">${fmtPrice(r.preco)}</span></td>
          <td style="text-align:center">
            <a class="wa-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" target="_blank">Tenho Interesse</a>
          </td>
        </tr>`;
      }).join("");
    }
    document.getElementById("countBadge").textContent = `${rows.length} itens`;
  }

  function populateFilters() {
    const brands = [...new Set(STOCK.map(r => r.marca))].sort();
    const storages = [...new Set(STOCK.map(r => r.armazenamento))].sort();
    const bf = document.getElementById("brandFilter");
    const sf = document.getElementById("storageFilter");
    bf.innerHTML = '<option value="">Todas as marcas</option>';
    sf.innerHTML = '<option value="">Todo armazenamento</option>';
    brands.forEach(b => { if(b) bf.innerHTML += `<option value="${b}">${b}</option>`; });
    storages.forEach(s => { if(s) sf.innerHTML += `<option value="${s}">${s}</option>`; });
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("brandFilter").addEventListener("change", render);
  document.getElementById("storageFilter").addEventListener("change", render);
  document.getElementById("footerDate").textContent = new Date().toLocaleDateString("pt-BR");

  // Inicia a carga dos dados
  loadSheetData();
</script>
