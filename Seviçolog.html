<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRCELL - Log OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(24,24,27,0.9); border: 1px solid #27272a; }
        input, textarea, select {
            background-color: #18181b !important;
            border: 1px solid #27272a !important;
            color: white !important;
            font-size: 13px !important;
            transition: border-color 0.15s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #22c55e !important;
            outline: none;
        }
        select option { background: #18181b; color: white; }
        .section-label {
            font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
            text-transform: uppercase; color: #52525b; margin-bottom: 4px; display: block;
        }
        .os-card {
            background: rgba(24,24,27,0.7); border: 1px solid #27272a; border-radius: 14px;
            padding: 14px 16px; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .os-card::before {
            content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
            background:#3f3f46; transition: background 0.2s; border-radius: 14px 0 0 14px;
        }
        .os-card:hover { border-color:#3f3f46; transform:translateY(-1px); }
        .os-card.s-aguardando::before { background:#f59e0b; }
        .os-card.s-pronto::before     { background:#22c55e; }
        .os-card.s-entregue::before   { background:#3b82f6; }
        .os-card.s-cancelado::before  { background:#ef4444; }
        .badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:2px 8px; border-radius:999px;
            font-size:9px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
        }
        .b-aguardando { background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
        .b-pronto     { background:rgba(34,197,94,0.15);  color:#22c55e; border:1px solid rgba(34,197,94,0.3); }
        .b-entregue   { background:rgba(59,130,246,0.15); color:#60a5fa; border:1px solid rgba(59,130,246,0.3); }
        .b-cancelado  { background:rgba(239,68,68,0.15);  color:#f87171; border:1px solid rgba(239,68,68,0.3); }
        #loadingOverlay {
            display:none; position:fixed; inset:0; background:rgba(9,9,11,0.95); z-index:9999;
            flex-direction:column; align-items:center; justify-content:center;
        }
        .spinner { width:40px; height:40px; border:3px solid #27272a; border-top:3px solid #22c55e; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #modal-wrap {
            display:none; position:fixed; inset:0; z-index:1000;
            background:rgba(9,9,11,0.92); backdrop-filter:blur(4px); overflow-y:auto; padding:16px;
        }
        #modal-wrap.open { display:flex; align-items:flex-start; justify-content:center; }
        .modal-box { background:#111113; border:1px solid #27272a; border-radius:20px; width:100%; max-width:640px; margin:auto; padding:24px; }
        #toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
            background:#18181b; border:1px solid #27272a; border-radius:12px;
            padding:10px 20px; font-size:12px; font-weight:700; z-index:99999;
            transition:transform 0.3s ease; display:flex; align-items:center; gap:8px;
        }
        #toast.show { transform:translateX(-50%) translateY(0); }
        #toast.success { border-color:rgba(34,197,94,0.5); color:#22c55e; }
        #toast.error   { border-color:rgba(239,68,68,0.5);  color:#f87171; }
        input[type="date"] { color-scheme: dark; }

        /* ── IMPRESSÃO ───────────────────────────────── */
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .no-print { display: none !important; }
            #print-area {
                display: block !important;
                font-family: Arial, sans-serif;
                font-size: 12px;
                color: #000;
                padding: 0;
                margin: 0;
            }
            #print-area * { color: #000 !important; background: transparent !important; border-color: #ccc !important; }
        }
        #print-area { display: none; }
    </style>
</head>
<body class="min-h-screen p-4">

<div id="loadingOverlay">
    <div class="spinner mb-4"></div>
    <p id="loadingStatus" class="text-green-500 font-black uppercase tracking-widest text-[10px]">Carregando...</p>
</div>
<div id="toast"></div>

<!-- Área de Impressão (oculta na tela, visível ao imprimir) -->
<div id="print-area"></div>

<!-- Modal de Edição -->
<div id="modal-wrap">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="bg-green-500/20 p-2.5 rounded-xl"><i data-lucide="file-text" class="text-green-500 w-4 h-4"></i></div>
        <div>
          <h2 class="text-base font-black text-white">OS <span id="modal-id" class="text-green-500"></span></h2>
          <p class="text-[9px] text-zinc-500 uppercase font-bold tracking-widest">Visualizar · Editar · Enviar</p>
        </div>
      </div>
      <button onclick="fecharModal()" class="p-2 rounded-xl border border-zinc-800 hover:border-zinc-600">
        <i data-lucide="x" class="w-4 h-4 text-zinc-400"></i>
      </button>
    </div>

    <form id="formEdicao" onsubmit="salvarEdicao(event)" class="space-y-4">
      <input type="hidden" id="edit-id">

      <!-- Status + Datas -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <span class="section-label">Status</span>
          <select id="edit-status" class="w-full p-2.5 rounded-xl">
            <option value="Aguardando">⏳ Aguardando</option>
            <option value="Pronto">✅ Pronto</option>
            <option value="Entregue">📦 Entregue</option>
            <option value="Cancelado">❌ Cancelado</option>
          </select>
        </div>
        <div>
          <span class="section-label">Entrada</span>
          <input type="date" id="edit-data" class="w-full p-2.5 rounded-xl">
        </div>
        <div>
          <span class="section-label" style="color:#f59e0b">Previsão</span>
          <input type="date" id="edit-data_prevista" class="w-full p-2.5 rounded-xl">
        </div>
      </div>

      <!-- Cliente -->
      <div class="border-t border-zinc-800 pt-4 space-y-3">
        <p class="section-label text-zinc-600">Cliente</p>
        <div>
          <span class="section-label">Nome</span>
          <input type="text" id="edit-nome" class="w-full p-2.5 rounded-xl">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <span class="section-label">CPF / CNPJ</span>
            <input type="text" id="edit-cpf" class="w-full p-2.5 rounded-xl">
          </div>
          <div>
            <span class="section-label">E-mail</span>
            <input type="email" id="edit-email" class="w-full p-2.5 rounded-xl">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <span class="section-label">Celular 1 (WhatsApp)</span>
            <input type="text" id="edit-telefone" oninput="maskTel(this)" class="w-full p-2.5 rounded-xl font-bold text-green-400">
          </div>
          <div>
            <span class="section-label">Celular 2</span>
            <input type="text" id="edit-telefone2" oninput="maskTel(this)" class="w-full p-2.5 rounded-xl">
          </div>
        </div>
      </div>

      <!-- Endereço -->
      <div class="border-t border-zinc-800 pt-4 space-y-3">
        <p class="section-label text-zinc-600">Endereço</p>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <span class="section-label">CEP</span>
            <input type="text" id="edit-cep" class="w-full p-2.5 rounded-xl">
          </div>
          <div class="col-span-2">
            <span class="section-label">Rua</span>
            <input type="text" id="edit-endereco" class="w-full p-2.5 rounded-xl">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <span class="section-label">Bairro</span>
            <input type="text" id="edit-bairro" class="w-full p-2.5 rounded-xl">
          </div>
          <div>
            <span class="section-label">Cidade - UF</span>
            <input type="text" id="edit-municipio" class="w-full p-2.5 rounded-xl">
          </div>
        </div>
      </div>

      <!-- Serviço -->
      <div class="border-t border-zinc-800 pt-4 space-y-3">
        <p class="section-label text-zinc-600">Serviço</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <span class="section-label">Aparelho</span>
            <input type="text" id="edit-aparelho" class="w-full p-2.5 rounded-xl">
          </div>
          <div>
            <span class="section-label">Senha</span>
            <input type="text" id="edit-senha" class="w-full p-2.5 rounded-xl">
          </div>
        </div>
        <div>
          <span class="section-label">Defeito relatado</span>
          <textarea id="edit-problema" class="w-full p-2.5 rounded-xl h-16"></textarea>
        </div>
        <div>
          <span class="section-label">Checklist</span>
          <input type="text" id="edit-checklist" class="w-full p-2.5 rounded-xl">
        </div>
        <div>
          <span class="section-label">Valor</span>
          <input type="text" id="edit-valor" oninput="maskMoney(this)" class="w-full p-2.5 rounded-xl text-xl font-black text-center">
        </div>
      </div>

      <!-- Ações do modal -->
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="fecharModal()" class="flex-1 py-2.5 rounded-xl border border-zinc-700 text-zinc-400 hover:border-zinc-500 font-bold text-xs transition-colors">
          Cancelar
        </button>
        <button type="button" id="btn-imprimir" onclick="imprimirOS()" class="py-2.5 px-4 rounded-xl border border-zinc-700 text-zinc-300 hover:border-blue-500/40 hover:text-blue-400 font-bold text-xs transition-colors flex items-center gap-1.5">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i> Imprimir
        </button>
        <button type="button" id="btn-whatsapp" onclick="enviarWhatsApp()" class="py-2.5 px-4 rounded-xl border border-zinc-700 text-zinc-300 hover:border-green-500/40 hover:text-green-400 font-bold text-xs transition-colors flex items-center gap-1.5">
          <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> WhatsApp
        </button>
        <button type="submit" class="flex-1 py-2.5 rounded-xl bg-green-600 hover:bg-green-500 text-white font-black text-xs transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="save" class="w-3.5 h-3.5"></i> Salvar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Página Principal -->
<div class="max-w-xl mx-auto">

  <!-- Header -->
  <div class="glass rounded-2xl p-5 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-green-500/20 p-2.5 rounded-xl"><i data-lucide="clipboard-list" class="text-green-500 w-5 h-5"></i></div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-white">BRCELL <span class="text-green-500">Log</span></h1>
        <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Ordens de Serviço</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="total-badge" class="text-[10px] font-black bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded-full">— OS</span>
      <button onclick="carregarOS()" class="p-2.5 rounded-xl border border-zinc-800 hover:border-green-500/30 hover:text-green-400 transition-colors" title="Recarregar">
        <i data-lucide="refresh-cw" class="w-4 h-4 text-zinc-400"></i>
      </button>
      <a href="index.html" class="p-2.5 rounded-xl border border-zinc-800 hover:border-green-500/30 transition-colors" title="Nova OS">
        <i data-lucide="plus" class="w-4 h-4 text-zinc-400"></i>
      </a>
    </div>
  </div>

  <!-- Filtros -->
  <div class="glass rounded-2xl p-4 mb-4 space-y-3 no-print">
    <div class="relative">
      <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-zinc-500 pointer-events-none"></i>
      <input type="text" id="filtro-busca" oninput="aplicarFiltros()" placeholder="Buscar por nome ou CPF..." class="w-full p-2.5 pl-10 rounded-xl">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <span class="section-label">Data de entrada</span>
        <input type="date" id="filtro-data" onchange="aplicarFiltros()" class="w-full p-2.5 rounded-xl">
      </div>
      <div>
        <span class="section-label">Status</span>
        <select id="filtro-status" onchange="aplicarFiltros()" class="w-full p-2.5 rounded-xl">
          <option value="">Todos</option>
          <option value="Aguardando">⏳ Aguardando</option>
          <option value="Pronto">✅ Pronto</option>
          <option value="Entregue">📦 Entregue</option>
          <option value="Cancelado">❌ Cancelado</option>
        </select>
      </div>
    </div>
    <button onclick="limparFiltros()" class="text-[10px] font-bold text-zinc-600 hover:text-zinc-400 uppercase tracking-widest transition-colors">
      Limpar filtros
    </button>
  </div>

  <!-- Lista -->
  <div id="lista-os" class="space-y-2"></div>

</div>

<script>
  const URL_SERVICO = "https://script.google.com/macros/s/AKfycbw7aF7vPnHfXfmNK37a1Q_Cjk8pUpzMJrKOBVL4j4tna8vqn3ocmFU4v7jP7jIaDwvL/exec";
  let todasOS = [];
  let osAtual = null;
  const loading = document.getElementById('loadingOverlay');
  const loadingStatus = document.getElementById('loadingStatus');

  document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); carregarOS(); });

  async function carregarOS() {
    loading.style.display = 'flex';
    loadingStatus.innerText = 'Carregando OS...';
    try {
      const res = await fetch(URL_SERVICO, { method:'POST', body: JSON.stringify({ acao:'listar' }) });
      const data = await res.json();
      todasOS = data.os || [];
      aplicarFiltros();
    } catch(e) {
      console.error(e);
      mostrarEmpty('Erro ao conectar. Verifique sua conexão.');
    }
    loading.style.display = 'none';
    lucide.createIcons();
  }

  function aplicarFiltros() {
    const busca  = document.getElementById('filtro-busca').value.toLowerCase().trim();
    const data   = document.getElementById('filtro-data').value;
    const status = document.getElementById('filtro-status').value;

    const filtradas = todasOS.filter(os => {
      const matchBusca  = !busca  || (os.Nome||'').toLowerCase().includes(busca) || (os.CPF||'').replace(/\D/g,'').includes(busca.replace(/\D/g,''));
      const matchStatus = !status || (os.status||'Aguardando') === status;
      let matchData = true;
      if (data && os.Data) {
        const p = os.Data.split('/');
        if (p.length === 3) matchData = `${p[2]}-${p[1]}-${p[0]}` === data;
      }
      return matchBusca && matchData && matchStatus;
    });
    renderizar(filtradas);
  }

  function limparFiltros() {
    document.getElementById('filtro-busca').value = '';
    document.getElementById('filtro-data').value = '';
    document.getElementById('filtro-status').value = '';
    aplicarFiltros();
  }

  function renderizar(lista) {
    const container = document.getElementById('lista-os');
    document.getElementById('total-badge').textContent = `${lista.length} OS`;

    if (!lista.length) { mostrarEmpty('Nenhuma OS encontrada.'); return; }

    container.innerHTML = lista.map(os => {
      const status = os.status || 'Aguardando';
      const sk = status.toLowerCase();
      const badges = { aguardando:'b-aguardando', pronto:'b-pronto', entregue:'b-entregue', cancelado:'b-cancelado' };
      return `
      <div class="os-card s-${sk}" onclick='abrirModal(${JSON.stringify(os).replace(/'/g,"&#39;")})'>
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] font-black text-green-500 tracking-widest">OS #${os.ID||'—'}</span>
              <span class="badge ${badges[sk]||'b-aguardando'}">${status}</span>
            </div>
            <p class="font-bold text-white text-sm truncate">${os.Nome||'—'}</p>
            <p class="text-xs text-zinc-500 mt-0.5 truncate">${os.Aparelho||'Aparelho não informado'}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-sm font-black text-white">${os.Valor||'—'}</p>
            <p class="text-[10px] text-zinc-600 mt-0.5">${os.Data||'—'}</p>
          </div>
        </div>
        ${os.Problema ? `<p class="text-[11px] text-zinc-600 mt-2 line-clamp-1 border-t border-zinc-800 pt-2">${os.Problema}</p>` : ''}
      </div>`;
    }).join('');
    lucide.createIcons();
  }

  function mostrarEmpty(msg) {
    document.getElementById('lista-os').innerHTML = `
      <div class="text-center py-16 glass rounded-2xl">
        <i data-lucide="inbox" class="w-10 h-10 text-zinc-700 mx-auto mb-3"></i>
        <p class="text-zinc-500 text-sm font-bold">${msg}</p>
      </div>`;
    lucide.createIcons();
  }

  function abrirModal(os) {
    osAtual = os;
    document.getElementById('modal-id').textContent        = `#${os.ID||'—'}`;
    document.getElementById('edit-id').value               = os.ID || '';
    document.getElementById('edit-data').value             = isoData(os.Data);
    document.getElementById('edit-data_prevista').value    = isoData(os.Data_Prevista);
    document.getElementById('edit-status').value           = os.status || 'Aguardando';
    document.getElementById('edit-nome').value             = os.Nome || '';
    document.getElementById('edit-cpf').value              = os.CPF || '';
    document.getElementById('edit-email').value            = os.Email || '';
    document.getElementById('edit-telefone').value         = os.Telefone || '';
    document.getElementById('edit-telefone2').value        = os.Telefone_2 || '';
    document.getElementById('edit-cep').value              = os.CEP || '';
    document.getElementById('edit-endereco').value         = os['Endereço'] || '';
    document.getElementById('edit-bairro').value           = os.Bairro || '';
    document.getElementById('edit-municipio').value        = os.Municipio || '';
    document.getElementById('edit-aparelho').value         = os.Aparelho || '';
    document.getElementById('edit-senha').value            = os.Senha || '';
    document.getElementById('edit-problema').value         = os.Problema || '';
    document.getElementById('edit-checklist').value        = os.Checklist || '';
    document.getElementById('edit-valor').value            = os.Valor || '';
    document.getElementById('modal-wrap').classList.add('open');
    document.body.style.overflow = 'hidden';
    lucide.createIcons();
  }

  function fecharModal() {
    document.getElementById('modal-wrap').classList.remove('open');
    document.body.style.overflow = '';
    osAtual = null;
  }
  document.getElementById('modal-wrap').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-wrap')) fecharModal();
  });

  async function salvarEdicao(e) {
    e.preventDefault();
    loading.style.display = 'flex';
    loadingStatus.innerText = 'Salvando...';

    const payload = {
      acao:          'editar',
      ID:            document.getElementById('edit-id').value,
      Data:          brData(document.getElementById('edit-data').value),
      Data_Prevista: brData(document.getElementById('edit-data_prevista').value),
      status:        document.getElementById('edit-status').value,
      Nome:          document.getElementById('edit-nome').value,
      CPF:           document.getElementById('edit-cpf').value,
      Email:         document.getElementById('edit-email').value,
      Telefone:      document.getElementById('edit-telefone').value,
      Telefone_2:    document.getElementById('edit-telefone2').value,
      CEP:           document.getElementById('edit-cep').value,
      'Endereço':    document.getElementById('edit-endereco').value,
      Bairro:        document.getElementById('edit-bairro').value,
      Municipio:     document.getElementById('edit-municipio').value,
      Aparelho:      document.getElementById('edit-aparelho').value,
      Senha:         document.getElementById('edit-senha').value,
      Problema:      document.getElementById('edit-problema').value,
      Checklist:     document.getElementById('edit-checklist').value,
      Valor:         document.getElementById('edit-valor').value
    };

    try {
      const res = await fetch(URL_SERVICO, { method:'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === 'sucesso') {
        fecharModal();
        toast('OS #' + payload.ID + ' atualizada!', 'success');
        await carregarOS();
      } else {
        toast('Erro: ' + (data.msg || 'tente novamente'), 'error');
      }
    } catch(err) {
      toast('Erro de conexão.', 'error');
    }
    loading.style.display = 'none';
  }

  /* ── IMPRIMIR ─────────────────────────────────────── */
  function imprimirOS() {
    const id       = document.getElementById('edit-id').value;
    const nome     = document.getElementById('edit-nome').value;
    const cpf      = document.getElementById('edit-cpf').value;
    const tel1     = document.getElementById('edit-telefone').value;
    const tel2     = document.getElementById('edit-telefone2').value;
    const email    = document.getElementById('edit-email').value;
    const cep      = document.getElementById('edit-cep').value;
    const end      = document.getElementById('edit-endereco').value;
    const bairro   = document.getElementById('edit-bairro').value;
    const mun      = document.getElementById('edit-municipio').value;
    const aparelho = document.getElementById('edit-aparelho').value;
    const senha    = document.getElementById('edit-senha').value;
    const problema = document.getElementById('edit-problema').value;
    const checklist= document.getElementById('edit-checklist').value;
    const valor    = document.getElementById('edit-valor').value;
    const status   = document.getElementById('edit-status').value;
    const entrada  = brData(document.getElementById('edit-data').value);
    const previsao = brData(document.getElementById('edit-data_prevista').value);

    const printContent = `
      <style>
        @media print {
          body { font-family: Arial, sans-serif; font-size: 12px; color: #000; margin: 0; padding: 20px; }
        }
        .print-header { display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #000; padding-bottom:12px; margin-bottom:16px; }
        .print-title { font-size:22px; font-weight:900; letter-spacing:-0.5px; }
        .print-sub { font-size:9px; text-transform:uppercase; letter-spacing:2px; color:#555; }
        .print-os { font-size:18px; font-weight:900; }
        .print-section { margin-bottom:14px; }
        .print-section-title { font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:2px; color:#555; margin-bottom:6px; border-bottom:1px solid #ddd; padding-bottom:3px; }
        .print-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; }
        .print-field label { font-size:8px; font-weight:700; text-transform:uppercase; color:#777; display:block; }
        .print-field span { font-size:12px; font-weight:600; }
        .print-field.full { grid-column: 1/-1; }
        .status-badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:1px; border:1.5px solid #000; }
        .print-valor { font-size:26px; font-weight:900; text-align:center; padding:12px; border:2px solid #000; border-radius:8px; margin-top:12px; }
        .print-assinatura { margin-top:20px; border-top:1px dashed #ccc; padding-top:12px; display:flex; justify-content:space-between; font-size:10px; }
        .sig-line { border-bottom:1px solid #000; width:200px; height:30px; }
      </style>
      <div class="print-header">
        <div>
          <div class="print-title">BRCELL</div>
          <div class="print-sub">Assistência Técnica</div>
        </div>
        <div style="text-align:right">
          <div class="print-os">OS #${id}</div>
          <div class="status-badge">${status}</div>
          <div style="font-size:10px;color:#555;margin-top:4px">Entrada: ${entrada} &nbsp;|&nbsp; Previsão: ${previsao||'—'}</div>
        </div>
      </div>

      <div class="print-section">
        <div class="print-section-title">Dados do Cliente</div>
        <div class="print-grid">
          <div class="print-field full"><label>Nome</label><span>${nome}</span></div>
          <div class="print-field"><label>CPF / CNPJ</label><span>${cpf||'—'}</span></div>
          <div class="print-field"><label>E-mail</label><span>${email||'—'}</span></div>
          <div class="print-field"><label>Celular 1 (WhatsApp)</label><span>${tel1||'—'}</span></div>
          <div class="print-field"><label>Celular 2</label><span>${tel2||'—'}</span></div>
        </div>
      </div>

      <div class="print-section">
        <div class="print-section-title">Endereço</div>
        <div class="print-grid">
          <div class="print-field"><label>CEP</label><span>${cep||'—'}</span></div>
          <div class="print-field"><label>Endereço</label><span>${end||'—'}</span></div>
          <div class="print-field"><label>Bairro</label><span>${bairro||'—'}</span></div>
          <div class="print-field"><label>Cidade - UF</label><span>${mun||'—'}</span></div>
        </div>
      </div>

      <div class="print-section">
        <div class="print-section-title">Aparelho & Serviço</div>
        <div class="print-grid">
          <div class="print-field"><label>Aparelho</label><span>${aparelho}</span></div>
          <div class="print-field"><label>Senha / PIN</label><span>${senha||'—'}</span></div>
          <div class="print-field full"><label>Defeito Relatado</label><span>${problema||'—'}</span></div>
          <div class="print-field full"><label>Checklist</label><span>${checklist||'—'}</span></div>
        </div>
        <div class="print-valor">${valor||'R$ 0,00'}</div>
      </div>

      <div class="print-assinatura">
        <div>
          <div class="sig-line"></div>
          <div style="margin-top:4px;font-size:10px">Assinatura do cliente</div>
          <div style="font-size:9px;color:#555">${nome}</div>
        </div>
        <div style="text-align:right;font-size:9px;color:#555;align-self:flex-end">
          <div>BRCELL Assistência Técnica</div>
          <div>OS #${id} — ${entrada}</div>
        </div>
      </div>
    `;

    const printArea = document.getElementById('print-area');
    printArea.innerHTML = printContent;

    const originalBody = document.body.innerHTML;
    document.body.innerHTML = printContent;
    window.print();
    document.body.innerHTML = originalBody;
    lucide.createIcons();
    document.getElementById('modal-wrap').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  /* ── WHATSAPP ─────────────────────────────────────── */
  function enviarWhatsApp() {
    const tel      = document.getElementById('edit-telefone').value.replace(/\D/g,'');
    const nome     = document.getElementById('edit-nome').value;
    const id       = document.getElementById('edit-id').value;
    const aparelho = document.getElementById('edit-aparelho').value;
    const status   = document.getElementById('edit-status').value;
    const previsao = brData(document.getElementById('edit-data_prevista').value);
    const valor    = document.getElementById('edit-valor').value;
    const problema = document.getElementById('edit-problema').value;

    if (!tel) { toast('Cadastre o celular do cliente primeiro!', 'error'); return; }

    const statusEmoji = { Aguardando:'⏳', Pronto:'✅', Entregue:'📦', Cancelado:'❌' }[status] || '📋';

    let msg = `Olá, *${nome}*! 👋\n\n`;
    msg += `Segue o status do seu aparelho aqui na *BRCELL*:\n\n`;
    msg += `📋 *OS #${id}*\n`;
    msg += `📱 *Aparelho:* ${aparelho}\n`;
    msg += `🔧 *Defeito:* ${problema || '—'}\n`;
    msg += `${statusEmoji} *Status:* ${status}\n`;
    if (previsao) msg += `📅 *Previsão de entrega:* ${previsao}\n`;
    if (valor)    msg += `💰 *Valor:* ${valor}\n`;
    msg += `\nQualquer dúvida, estamos à disposição! 😊`;

    const numero = tel.startsWith('55') ? tel : '55' + tel;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  /* ── UTILS ────────────────────────────────────────── */
  function isoData(d) {
    if (!d) return '';
    const p = d.split('/');
    if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
    return d;
  }
  function brData(d) {
    if (!d) return '';
    const p = d.split('-');
    if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
    return d;
  }
  function maskTel(v) {
    v.value = v.value.replace(/\D/g,'')
      .replace(/^(\d{2})(\d)/g,'($1) $2')
      .replace(/(\d{5})(\d)/,'$1-$2')
      .substring(0,15);
  }
  function maskMoney(v) {
    let val = v.value.replace(/\D/g,'');
    val = (parseInt(val||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    v.value = val;
  }
  function toast(msg, tipo='success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${tipo}`;
    setTimeout(() => { el.className = tipo; }, 3000);
  }
</script>
</body>
</html>
